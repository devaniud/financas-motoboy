<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Finanças do Motoboy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171A;
    --surface:#1F2328;
    --surface-2:#272C32;
    --border:#34393F;
    --text:#ECEEF0;
    --text-muted:#9AA1A9;
    --accent:#C6FF00;
    --accent-dim:#8FB300;
    --expense:#FF7A59;
    --danger:#E14848;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    flex-direction:column;
    position:relative;
    padding-bottom:96px;
    margin:0 auto;
  }

  /* HEADER */
  header{
    padding:22px 20px 0 20px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:18px;
  }
  .brand-mark{
    width:10px;height:10px;border-radius:2px;background:var(--accent);
    transform:rotate(45deg);
  }
  .brand-name{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.02em;
    color:var(--text);
  }

  .tabs{
    display:flex;
    gap:22px;
    border-bottom:1px solid var(--border);
  }
  .tab{
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:500;
    padding:8px 0 12px 0;
    cursor:pointer;
    position:relative;
  }
  .tab.active{ color:var(--text); font-weight:600; }
  .tab.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px;
    background:var(--accent);
    border-radius:2px;
  }

  /* HERO */
  .hero{
    padding:28px 20px 8px 20px;
  }
  .hero-label{
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:2px;
  }
  .hero-value{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size:56px;
    line-height:1;
    letter-spacing:-0.01em;
  }
  .hero-value.positive{ color:var(--accent); }
  .hero-value.negative{ color:var(--expense); }

  .hero-sub{
    display:flex;
    gap:22px;
    margin-top:16px;
  }
  .hero-sub-item .k{ font-size:12px; color:var(--text-muted); margin-bottom:3px; }
  .hero-sub-item .v{ font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:20px; }
  .hero-sub-item.ganho .v{ color:var(--accent); }
  .hero-sub-item.gasto .v{ color:var(--expense); }

  /* BREAKDOWN */
  .breakdown{
    padding:22px 20px 4px 20px;
  }
  .section-title{
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  .bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:9px;
  }
  .bar-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .bar-name{ font-size:13.5px; width:72px; flex-shrink:0; color:var(--text); }
  .bar-track{
    flex:1;
    height:6px;
    background:var(--surface-2);
    border-radius:4px;
    overflow:hidden;
  }
  .bar-fill{ height:100%; border-radius:4px; }
  .bar-value{ font-size:13px; color:var(--text-muted); width:64px; text-align:right; flex-shrink:0; }

  /* LIST */
  .list{
    padding:24px 20px 0 20px;
    flex:1;
  }
  .entry{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid var(--border);
  }
  .entry-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .entry-info{ flex:1; min-width:0; }
  .entry-title{ font-size:14.5px; font-weight:500; }
  .entry-meta{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .entry-value{ font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:17px; flex-shrink:0; }
  .entry-value.ganho{ color:var(--accent); }
  .entry-value.gasto{ color:var(--expense); }
  .entry-del{
    background:none;border:none;color:var(--text-muted);
    font-size:18px; padding:4px 2px; cursor:pointer; line-height:1;
  }
  .empty{
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
    padding:40px 20px;
    line-height:1.5;
  }

  /* BOTTOM ACTION BAR */
  .action-bar{
    position:fixed;
    bottom:0; left:0; right:0;
    display:flex;
    justify-content:center;
  }
  .action-bar-inner{
    width:100%;
    max-width:480px;
    display:flex;
    gap:10px;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(20,23,26,0) 0%, var(--bg) 40%);
  }
  .action-btn{
    flex:1;
    border:none;
    border-radius:var(--radius);
    padding:14px 0;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
  }
  .action-btn.ganho{ background:var(--accent); color:#14171A; }
  .action-btn.gasto{ background:var(--surface-2); color:var(--expense); border:1px solid var(--border); }

  /* SHEET */
  .overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:20;
  }
  .overlay.open{ display:flex; }
  .sheet{
    width:100%;
    max-width:480px;
    background:var(--surface);
    border-radius:20px 20px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    animation:slideUp 0.22s ease-out;
  }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{
    width:36px; height:4px; background:var(--border); border-radius:2px;
    margin:0 auto 16px auto;
  }
  .sheet-title{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:22px;
    margin-bottom:18px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  .amount-input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:'Barlow Condensed', sans-serif;
    font-size:24px;
    font-weight:700;
  }
  .amount-input:focus{ outline:none; border-color:var(--accent); }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-muted);
    border-radius:20px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .chip.selected{ border-color:var(--accent); color:var(--text); background:rgba(198,255,0,0.08); }
  .text-input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 14px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  .text-input:focus{ outline:none; border-color:var(--accent); }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn-cancel{
    flex:1; background:none; border:1px solid var(--border); color:var(--text-muted);
    border-radius:10px; padding:13px 0; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer;
  }
  .btn-save{
    flex:2; background:var(--accent); border:none; color:#14171A;
    border-radius:10px; padding:13px 0; font-family:'Inter',sans-serif; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-save:disabled{ opacity:0.4; }

  .loading{
    text-align:center; color:var(--text-muted); font-size:13px; padding:60px 20px;
  }

  /* LOCK SCREEN */
  #lock{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:24px 28px;
  }
  .lock-mark{
    width:14px;height:14px;border-radius:3px;background:var(--accent);
    transform:rotate(45deg);
    margin-bottom:22px;
  }
  .lock-title{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:26px;
    margin-bottom:6px;
  }
  .lock-sub{
    font-size:14px;
    color:var(--text-muted);
    margin-bottom:26px;
    line-height:1.5;
  }
  .lock-input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    color:var(--text);
    font-family:'Barlow Condensed', sans-serif;
    font-size:20px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .lock-input:focus{ outline:none; border-color:var(--accent); }
  .lock-btn{
    width:100%;
    background:var(--accent);
    border:none;
    border-radius:10px;
    padding:14px 0;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    color:#14171A;
  }
  .lock-error{
    font-size:13px;
    color:var(--expense);
    margin-top:10px;
    min-height:16px;
  }
</style>
</head>
<body>
<div id="lock">
  <div class="lock-mark"></div>
  <div class="lock-title">Finanças na Estrada</div>
  <div class="lock-sub">Digite o código de acesso que você recebeu na compra pra liberar o app.</div>
  <input type="text" class="lock-input" id="lockInput" placeholder="CÓDIGO DE ACESSO" autocomplete="off">
  <button class="lock-btn" id="lockBtn">Entrar</button>
  <div class="lock-error" id="lockError"></div>
</div>

<div id="app" style="display:none;">
  <div id="loading" class="loading">Carregando seus lançamentos…</div>
  <div id="main" style="display:none;">
    <header>
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-name">FINANÇAS NA ESTRADA</div>
      </div>
      <div class="tabs">
        <button class="tab" data-period="dia">Hoje</button>
        <button class="tab" data-period="semana">Semana</button>
        <button class="tab" data-period="mes">Mês</button>
      </div>
    </header>

    <div class="hero">
      <div class="hero-label" id="heroLabel">Líquido hoje</div>
      <div class="hero-value" id="heroValue">R$ 0,00</div>
      <div class="hero-sub">
        <div class="hero-sub-item ganho">
          <div class="k">Ganhos</div>
          <div class="v" id="totalGanhos">R$ 0,00</div>
        </div>
        <div class="hero-sub-item gasto">
          <div class="k">Gastos</div>
          <div class="v" id="totalGastos">R$ 0,00</div>
        </div>
      </div>
    </div>

    <div class="breakdown" id="breakdownWrap" style="display:none;">
      <div class="section-title">Ganhos por app</div>
      <div id="breakdownList"></div>
    </div>

    <div class="list">
      <div class="section-title">Lançamentos</div>
      <div id="entryList"></div>
    </div>
  </div>
</div>

<div class="action-bar">
  <div class="action-bar-inner">
    <button class="action-btn gasto" id="btnAddGasto">+ Gasto</button>
    <button class="action-btn ganho" id="btnAddGanho">+ Ganho</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">Novo ganho</div>

    <div class="field">
      <label>Valor</label>
      <input type="number" inputmode="decimal" class="amount-input" id="amountInput" placeholder="R$ 0,00" step="0.01" min="0">
    </div>

    <div class="field" id="appFieldWrap">
      <label>App</label>
      <div class="chip-row" id="appChips"></div>
    </div>

    <div class="field" id="catFieldWrap" style="display:none;">
      <label>Categoria</label>
      <div class="chip-row" id="catChips"></div>
    </div>

    <div class="field">
      <label>Observação (opcional)</label>
      <input type="text" class="text-input" id="noteInput" placeholder="Ex: turno da noite">
    </div>

    <div class="sheet-actions">
      <button class="btn-cancel" id="btnCancel">Cancelar</button>
      <button class="btn-save" id="btnSave" disabled>Salvar</button>
    </div>
  </div>
</div>

<script>
const APPS = [
  { id:'ifood', name:'iFood', color:'#EA1D2C' },
  { id:'uber', name:'Uber', color:'#9AA1A9' },
  { id:'99', name:'99', color:'#FFD400' },
  { id:'rappi', name:'Rappi', color:'#FF441F' },
  { id:'outro_ganho', name:'Outro', color:'#8FB300' },
];
const CATS = [
  { id:'combustivel', name:'Combustível', color:'#FF7A59' },
  { id:'manutencao', name:'Manutenção', color:'#E14848' },
  { id:'alimentacao', name:'Alimentação', color:'#FFB84D' },
  { id:'outro_gasto', name:'Outro', color:'#9AA1A9' },
];

// >>> CÓDIGOS DE ACESSO VÁLIDOS <<<
// Adicione aqui os códigos que você quer liberar pros compradores.
// Pode ser um código único pra todo mundo, ou um por cliente — sua escolha.
const ACCESS_CODES = ['MOTOBOY10'];

let entries = [];
let period = 'dia';
let sheetType = null;
let selectedTag = null;
let storageOk = true;

const $ = (id) => document.getElementById(id);

function checkAccess(){
  let unlocked = false;
  try{ unlocked = localStorage.getItem('motoboy_unlocked') === '1'; }catch(err){}
  if(unlocked){
    $('lock').style.display = 'none';
    $('app').style.display = 'flex';
    load();
  }
}

function tryUnlock(){
  const code = $('lockInput').value.trim().toUpperCase();
  if(ACCESS_CODES.includes(code)){
    try{ localStorage.setItem('motoboy_unlocked', '1'); }catch(err){}
    $('lock').style.display = 'none';
    $('app').style.display = 'flex';
    load();
  } else {
    $('lockError').textContent = 'Código inválido. Confira e tente de novo.';
  }
}

$('lockBtn').addEventListener('click', tryUnlock);
$('lockInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
checkAccess();

function fmt(n){
  return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function startOfPeriod(p){
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(p === 'dia') return d;
  if(p === 'semana'){
    const day = d.getDay(); // 0=domingo
    const diff = (day === 0 ? 6 : day - 1); // segunda como início
    d.setDate(d.getDate() - diff);
    return d;
  }
  if(p === 'mes'){
    return new Date(now.getFullYear(), now.getMonth(), 1);
  }
}

function tagInfo(list, id){
  return list.find(x => x.id === id) || { name:id, color:'#9AA1A9' };
}

function render(){
  const start = startOfPeriod(period);
  const filtered = entries.filter(e => new Date(e.date) >= start);

  const ganhos = filtered.filter(e => e.type === 'ganho').reduce((s,e)=>s+e.value,0);
  const gastos = filtered.filter(e => e.type === 'gasto').reduce((s,e)=>s+e.value,0);
  const liquido = ganhos - gastos;

  $('heroLabel').textContent = 'Líquido ' + (period === 'dia' ? 'hoje' : period === 'semana' ? 'na semana' : 'no mês');
  $('heroValue').textContent = fmt(liquido);
  $('heroValue').className = 'hero-value ' + (liquido >= 0 ? 'positive' : 'negative');
  $('totalGanhos').textContent = fmt(ganhos);
  $('totalGastos').textContent = fmt(gastos);

  // breakdown por app
  const byApp = {};
  filtered.filter(e => e.type === 'ganho').forEach(e => {
    byApp[e.tag] = (byApp[e.tag] || 0) + e.value;
  });
  const appEntries = Object.entries(byApp).sort((a,b)=>b[1]-a[1]);
  if(appEntries.length === 0){
    $('breakdownWrap').style.display = 'none';
  } else {
    $('breakdownWrap').style.display = 'block';
    const max = Math.max(...appEntries.map(x=>x[1]));
    $('breakdownList').innerHTML = appEntries.map(([id,val]) => {
      const info = tagInfo(APPS, id);
      const pct = max ? Math.round((val/max)*100) : 0;
      return `<div class="bar-row">
        <div class="bar-dot" style="background:${info.color}"></div>
        <div class="bar-name">${info.name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${info.color}"></div></div>
        <div class="bar-value">${fmt(val)}</div>
      </div>`;
    }).join('');
  }

  // lista
  const sorted = [...filtered].sort((a,b) => new Date(b.date) - new Date(a.date));
  if(sorted.length === 0){
    $('entryList').innerHTML = `<div class="empty">Nenhum lançamento nesse período ainda.<br>Toque em + Ganho ou + Gasto pra começar.</div>`;
  } else {
    $('entryList').innerHTML = sorted.map(e => {
      const info = tagInfo(e.type === 'ganho' ? APPS : CATS, e.tag);
      const d = new Date(e.date);
      const dateStr = d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) + ' · ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      return `<div class="entry">
        <div class="entry-dot" style="background:${info.color}"></div>
        <div class="entry-info">
          <div class="entry-title">${info.name}${e.note ? ' — ' + escapeHtml(e.note) : ''}</div>
          <div class="entry-meta">${dateStr}</div>
        </div>
        <div class="entry-value ${e.type}">${e.type === 'ganho' ? '+' : '−'} ${fmt(e.value)}</div>
        <button class="entry-del" data-id="${e.id}">✕</button>
      </div>`;
    }).join('');
  }

  document.querySelectorAll('.entry-del').forEach(btn => {
    btn.onclick = () => deleteEntry(btn.dataset.id);
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function deleteEntry(id){
  entries = entries.filter(e => e.id !== id);
  await persist();
  render();
}

async function persist(){
  try{
    localStorage.setItem('motoboy_entries', JSON.stringify(entries));
  }catch(err){
    if(!storageOk) return;
    storageOk = false;
    showStorageNotice();
  }
}

async function load(){
  try{
    const raw = localStorage.getItem('motoboy_entries');
    entries = raw ? JSON.parse(raw) : [];
  }catch(err){
    storageOk = false;
    entries = [];
    showStorageNotice();
  }
  $('loading').style.display = 'none';
  $('main').style.display = 'block';
  render();
}

function showStorageNotice(){
  if(document.getElementById('storageNotice')) return;
  const el = document.createElement('div');
  el.id = 'storageNotice';
  el.style.cssText = 'margin:0 20px 4px 20px; padding:9px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; font-size:12px; color:var(--text-muted);';
  el.textContent = 'Não consegui salvar os dados nesse navegador (talvez modo anônimo) — os lançamentos ficam só enquanto o app estiver aberto.';
  const header = document.querySelector('header');
  header.parentNode.insertBefore(el, header.nextSibling);
}

// TABS
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    period = tab.dataset.period;
    render();
  };
});
document.querySelector('.tab[data-period="dia"]').classList.add('active');

// SHEET
function openSheet(type){
  sheetType = type;
  selectedTag = null;
  $('amountInput').value = '';
  $('noteInput').value = '';
  $('sheetTitle').textContent = type === 'ganho' ? 'Novo ganho' : 'Novo gasto';

  if(type === 'ganho'){
    $('appFieldWrap').style.display = 'block';
    $('catFieldWrap').style.display = 'none';
    $('appChips').innerHTML = APPS.map(a => `<div class="chip" data-id="${a.id}">${a.name}</div>`).join('');
    bindChips('appChips');
  } else {
    $('appFieldWrap').style.display = 'none';
    $('catFieldWrap').style.display = 'block';
    $('catChips').innerHTML = CATS.map(c => `<div class="chip" data-id="${c.id}">${c.name}</div>`).join('');
    bindChips('catChips');
  }
  updateSaveState();
  $('overlay').classList.add('open');
}

function bindChips(containerId){
  document.querySelectorAll('#' + containerId + ' .chip').forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll('#' + containerId + ' .chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      selectedTag = chip.dataset.id;
      updateSaveState();
    };
  });
}

function updateSaveState(){
  const val = parseFloat($('amountInput').value);
  $('btnSave').disabled = !(val > 0 && selectedTag);
}

$('amountInput').addEventListener('input', updateSaveState);
$('btnAddGanho').onclick = () => openSheet('ganho');
$('btnAddGasto').onclick = () => openSheet('gasto');
$('btnCancel').onclick = () => $('overlay').classList.remove('open');
$('overlay').onclick = (e) => { if(e.target === $('overlay')) $('overlay').classList.remove('open'); };

$('btnSave').onclick = async () => {
  const val = parseFloat($('amountInput').value);
  if(!(val > 0 && selectedTag)) return;
  entries.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    type: sheetType,
    value: val,
    tag: selectedTag,
    note: $('noteInput').value.trim(),
    date: new Date().toISOString(),
  });
  await persist();
  $('overlay').classList.remove('open');
  render();
};
</script>
</body>
</html>
